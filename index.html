<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calculator</title>
<style>
  :root { --bg:#111418; --display:#1b1f26; --key:#262b33; --op:#ff9f0a; --fn:#3a414d; --text:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .app { height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom)); }
  .display { flex:1; background:var(--display); border-radius:20px; margin:12px 0;
    padding:16px 20px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;
    overflow:hidden; min-height:140px; }
  .expr { color:#8b93a1; font-size:1.2rem; min-height:1.6rem; word-break:break-all; text-align:right; }
  .value { font-size:3.4rem; font-weight:300; line-height:1.1; word-break:break-all; text-align:right; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button { border:0; border-radius:50px; height:68px; font-size:1.6rem; color:var(--text);
    background:var(--key); cursor:pointer; touch-action:manipulation; }
  button:active { filter:brightness(1.35); }
  button.fn { background:var(--fn); }
  button.op { background:var(--op); }
  button.zero { grid-column:span 2; text-align:left; padding-left:28px; }
  @media (max-height:640px){ button{height:56px;font-size:1.4rem} .value{font-size:2.6rem} }
</style>
</head>
<body>
<div class="app">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-a="clear">AC</button>
    <button class="fn" data-a="sign">±</button>
    <button class="fn" data-a="percent">%</button>
    <button class="op" data-a="op" data-v="÷">÷</button>

    <button data-a="num" data-v="7">7</button>
    <button data-a="num" data-v="8">8</button>
    <button data-a="num" data-v="9">9</button>
    <button class="op" data-a="op" data-v="×">×</button>

    <button data-a="num" data-v="4">4</button>
    <button data-a="num" data-v="5">5</button>
    <button data-a="num" data-v="6">6</button>
    <button class="op" data-a="op" data-v="−">−</button>

    <button data-a="num" data-v="1">1</button>
    <button data-a="num" data-v="2">2</button>
    <button data-a="num" data-v="3">3</button>
    <button class="op" data-a="op" data-v="+">+</button>

    <button class="zero" data-a="num" data-v="0">0</button>
    <button data-a="dot">.</button>
    <button class="op" data-a="equals">=</button>
  </div>
</div>

<script>
(function () {
  var current = "0", prev = null, op = null, fresh = true, justEvaluated = false;
  var valueEl = document.getElementById("value");
  var exprEl = document.getElementById("expr");

  function fmt(s) {
    if (s === "Error") return s;
    var neg = s[0] === "-", body = neg ? s.slice(1) : s;
    var parts = body.split("."), i = parts[0], d = parts[1];
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + i + (d !== undefined ? "." + d : "");
  }
  function render() {
    valueEl.textContent = fmt(current);
    var len = valueEl.textContent.length;
    valueEl.style.fontSize = len > 14 ? "1.8rem" : len > 10 ? "2.4rem" : len > 7 ? "3rem" : "";
    exprEl.textContent = (prev !== null && op) ? fmt(prev) + " " + op : "";
  }
  function compute(a, b, o) {
    a = parseFloat(a); b = parseFloat(b);
    var r;
    if (o === "+") r = a + b;
    else if (o === "−") r = a - b;
    else if (o === "×") r = a * b;
    else if (o === "÷") { if (b === 0) return "Error"; r = a / b; }
    else r = b;
    if (!isFinite(r)) return "Error";
    r = parseFloat(r.toPrecision(12));
    return String(r);
  }
  function num(d) {
    if (current === "Error") clearAll();
    if (fresh || current === "0") { current = d; fresh = false; }
    else if (current.replace(/[-.]/g, "").length < 15) current += d;
    justEvaluated = false;
  }
  function dot() {
    if (current === "Error") clearAll();
    if (fresh) { current = "0."; fresh = false; }
    else if (current.indexOf(".") === -1) current += ".";
    justEvaluated = false;
  }
  function setOp(o) {
    if (current === "Error") return;
    if (op && !fresh) { current = compute(prev, current, op); }
    prev = current; op = o; fresh = true; justEvaluated = false;
  }
  function equals() {
    if (current === "Error" || !op) return;
    var result = compute(prev, current, op);
    exprEl.textContent = fmt(prev) + " " + op + " " + fmt(current) + " =";
    current = result; prev = null; op = null; fresh = true; justEvaluated = true;
    valueEl.textContent = fmt(current);
    return true;
  }
  function clearAll() { current = "0"; prev = null; op = null; fresh = true; justEvaluated = false; }
  function sign() {
    if (current === "Error" || current === "0") return;
    current = current[0] === "-" ? current.slice(1) : "-" + current;
  }
  function percent() {
    if (current === "Error") return;
    current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    fresh = false;
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var a = b.dataset.a, v = b.dataset.v, keepExpr = false;
    if (a === "num") num(v);
    else if (a === "dot") dot();
    else if (a === "op") setOp(v);
    else if (a === "equals") keepExpr = equals();
    else if (a === "clear") clearAll();
    else if (a === "sign") sign();
    else if (a === "percent") percent();
    if (keepExpr) { valueEl.style.fontSize = ""; } else render();
    if (navigator.vibrate) navigator.vibrate(8);
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
